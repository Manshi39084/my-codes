<!DOCTYPE html>
<html>
<head><title>Online Exam System</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="container" id="loginBox">
<h2>🎓 Student Login</h2>
<input type="text" id="studentName" placeholder="Manshi">
<button onclick="login()">Login & Start Test</button>
<br><br><a href="#" onclick="showAdmin()">Admin Login</a>
</div>

<div class="container hidden" id="quizBox">
<h3 id="welcome"></h3><div id="timer">Time: 10:00Am</div>
<h4 id="questions"></h4>
<div id="options"></div>
<button onclick="nextQuestion()">Next</button>
</div>

<div class="container hidden" id="adminBox">
<h2>Admin</h2>
<p>Single question mode is ON. Adding is disable.</p>
<button onclick="addQuestion()">Add Question</button>
<ul id="qList"></ul>
<button onclick="location.reload()">Back</button>
</div>

<div class="container hidden" id="resultBox">
    <h2>Result</h2>
    <h3 id="score"></h3>
    <button onclick="location.reload()">Retake</button>
</div>
<script src="app.js"></script>
</body>
</html>
